<!DOCTYPE html>
<html>
<head>
    <title>Rent a Car</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        h2 { color: #333; }
        form { margin-top: 20px; }
        p { color: green; }
        .error { color: red; }
        a { margin-right: 10px; }
    </style>
</head>
<body>
    <h2>Rent a Car</h2>
    <h3>Users</h3>
    <ul>
        <li th:each="user : ${users}" th:text="${user}"></li>
    </ul>
    <h3>Available Cars</h3>
    <ul>
        <li th:each="car : ${cars}" th:text="${car}"></li>
        <li th:if="${#lists.isEmpty(cars)}">No cars available.</li>
    </ul>
    <form method="post" action="/rent">
        <label>User ID: <input type="number" name="userId" required></label><br>
        <label>Car ID: <input type="number" name="carId" required></label><br>
        <button type="submit">Rent Car</button>
    </form>
    <p th:if="${message}" th:text="${message}"></p>
    <p class="error" th:if="${error}" th:text="${error}"></p>
    <a href="/">Back to Home</a>
</body>
</html>
