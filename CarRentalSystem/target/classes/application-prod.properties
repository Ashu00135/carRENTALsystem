# Application configuration for Production environment
spring.profiles.active=prod
spring.application.name=Car Rental System - Production

# Server Configuration
server.port=8080
server.servlet.context-path=/

# Database Configuration - Can be switched to MySQL or PostgreSQL
# For production, use a persistent database instead of H2
spring.datasource.url=jdbc:h2:mem:carrental
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Example for MySQL (uncomment and configure if using MySQL):
# spring.datasource.url=jdbc:mysql://localhost:3306/carrental
# spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
# spring.datasource.username=carrental_user
# spring.datasource.password=your_secure_password

# H2 Console disabled in production for security
spring.h2.console.enabled=false

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Logging Configuration - Less verbose in production
logging.level.root=WARN
logging.level.com.ashutosh.carrental=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=logs/carrental.log
logging.file.max-size=10MB
logging.file.max-history=10

# Tomcat Configuration
server.tomcat.max-threads=200
server.tomcat.min-spare-threads=10
server.compression.enabled=true
server.compression.min-response-size=1024
