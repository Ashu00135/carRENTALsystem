# Application configuration for Development environment
spring.profiles.active=dev
spring.application.name=Car Rental System

# Server Configuration
server.port=8080
server.servlet.context-path=/

# Database Configuration - H2 (in-memory for dev)
spring.datasource.url=jdbc:h2:mem:carrental
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console for database inspection
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging Configuration
logging.level.root=INFO
logging.level.com.ashutosh.carrental=DEBUG
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Tomcat Configuration
server.tomcat.max-threads=200
server.tomcat.min-spare-threads=10
